name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment name
        required: true
        default: prod
        type: string
      location:
        description: Azure region
        required: true
        default: eastus
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: copilot/app-modernisation

      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: dotnet test ContosoUniversity/ContosoUniversity.sln --configuration Release

      - name: Publish application
        run: dotnet publish ContosoUniversity/ContosoUniversity.csproj --configuration Release --output publish

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infrastructure
        uses: azure/arm-deploy@v2.0.0
        with:
          scope: subscription
          region: ${{ inputs.location }}
          template: infra/main.bicep
          deploymentName: contoso-university-${{ inputs.environment }}
          parameters: >
            location=${{ inputs.location }}
            environmentName=${{ inputs.environment }}
            sqlAdministratorLogin=contosoadmin
            sqlAdministratorPassword=${{ secrets.SQL_ADMIN_PASSWORD }}

      - name: Deploy application
        uses: azure/webapps-deploy@v3.0.6
        with:
          app-name: ${{ steps.infrastructure.outputs.appName }}
          package: publish
